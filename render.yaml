services:
  - type: web
    name: infinity-trader-api
    plan: free
    env: python
    healthCheckPath: /health
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python3 -c \"import alembic.config; alembic.config.main(argv=['upgrade', 'head'])\" && python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-trader-db
          property: connectionString
      - key: RAZORPAY_API_KEY
        sync: false
      - key: RAZORPAY_API_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false

  - type: web
    name: infinity-trader-telegram-bot
    plan: free
    env: python
    buildCommand: "pip install -r telegram_bot/requirements.txt"
    startCommand: "cd telegram_bot && python bot.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_BASE_URL
        value: "https://infinity-trader-api-o0m7.onrender.com/api/v1"
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false



databases:
  - name: infinity-trader-db
    databaseName: infinitytrader
    user: admin
    plan: free
